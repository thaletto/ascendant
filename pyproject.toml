[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-ascendant"
version = "2.0.0"
description = "Vedic Astrology Calculation Library"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "pyswisseph",
    "python-dateutil",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pycodestyle",
    "prettytable",
]
[project.urls]
Homepage = "https://github.com/thaletto/ascendant"
Website = "https://ascendant-docs.vercel.app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ascendant*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"src/ascendant/yoga/registry/R*.py" = ["BLE001", "N999", "SIM102"]
