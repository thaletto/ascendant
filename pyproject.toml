[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-ascendant"
version = "1.1.2"
description = "Vedic Astrology Calculation Library"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "pyswisseph",
    "python-dateutil",
    "fastapi==0.141.1",
    "fastmcp==3.4.7",
    "psycopg[binary]==3.3.4",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pycodestyle",
    "prettytable",
]
[project.urls]
Homepage = "https://github.com/thaletto/ascendant"
Website = "https://ascendant-docs.vercel.app"

[tool.setuptools.packages.find]
include = ["ascendant*"]

[tool.ruff.lint.per-file-ignores]
"ascendant/yoga/registry/R*.py" = ["BLE001", "N999", "SIM102"]
