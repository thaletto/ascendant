[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-ascendant"
version = "1.1.1"
description = "Vedic Astrology Calculation Library"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "pyswisseph",
    "python-dateutil",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pycodestyle",
    "prettytable",
]

[project.urls]
Homepage = "https://github.com/thaletto/ascendant"

[tool.setuptools.packages.find]
include = ["ascendant*"]

[tool.ruff.lint.per-file-ignores]
"ascendant/yoga/registry/R*.py" = ["BLE001", "N999", "SIM102"]
