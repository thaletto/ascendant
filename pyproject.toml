[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-ascendant"
version = "1.1.2"
description = "Vedic Astrology Calculation Library"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "pyswisseph",
    "python-dateutil",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pycodestyle",
    "prettytable",
]
[project.urls]
Homepage = "https://github.com/thaletto/ascendant"
Website = "https://ascendant-docs.vercel.app"

[tool.setuptools]
package-dir = {ascendant = "src"}
packages = [
    "ascendant",
    "ascendant.chart",
    "ascendant.dasha",
    "ascendant.sav",
    "ascendant.yoga",
    "ascendant.yoga.registry",
]

[tool.ruff.lint.per-file-ignores]
"src/yoga/registry/R*.py" = ["BLE001", "N999", "SIM102"]
