name: Publish Python Package

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - ascendant/**

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # REQUIRED: This permission allows PyPI to verify the identity of the workflow
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build pytest
        pip install "flatlib @ git+https://github.com/thaletto/flatlib.git@2618c348ce1ab2588548f935ff65f031630b4872"
        pip install .
    - name: Test package
      run: >
        pytest -q tests/test_vedicastro_compatibility.py tests/chart.py
        tests/planets.py tests/dasha.py tests/yoga.py
        
    - name: Build package
      run: python -m build
      
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
